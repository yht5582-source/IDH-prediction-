name: HD-AI offline regression tests
on:
  push:
    paths:
      - 'importer.js'
      - 'realtime.js'
      - 'training-center.js'
      - 'tests/**'
      - '.github/workflows/importer-tests.yml'
  pull_request:
    paths:
      - 'importer.js'
      - 'realtime.js'
      - 'training-center.js'
      - 'tests/**'
      - '.github/workflows/importer-tests.yml'
permissions:
  contents: read
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate synthetic CSV importer
        run: node tests/importer.test.js
      - name: Validate synthetic playback controller
        run: node tests/realtime.test.js
      - name: Validate training-center readiness audit
        run: node tests/training-center.test.js
