name: HD-AI v0.9 CSV importer tests
on:
  push:
    paths:
      - 'importer.js'
      - 'tests/importer.test.js'
      - '.github/workflows/importer-tests.yml'
  pull_request:
    paths:
      - 'importer.js'
      - 'tests/importer.test.js'
      - '.github/workflows/importer-tests.yml'
permissions:
  contents: read
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate synthetic CSV importer
        run: node tests/importer.test.js
